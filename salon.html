<!doctype html>

<head>

<title>The Abide House Salon | Abide House Columbus</title>
<meta name="description" content="The Abide House Salon in German Village, Columbus. Meet the stylists and book online.">
<link rel="canonical" href="https://abidehousecolumbus.com/">

<!-- Share card. This page exists so a link posted to Instagram, Google Ads or
     a text message previews with the Abide House logo instead of the homepage
     photo. A #hash is never sent to the server, so /#salon cannot carry its
     own preview. This can. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Abide House Columbus">
<meta property="og:title" content="The Abide House Salon">
<meta property="og:description" content="A faith-based hair salon in German Village, Columbus. Meet the stylists and book online.">
<meta property="og:url" content="https://abidehousecolumbus.com/salon.html">
<meta property="og:image" content="https://abidehousecolumbus.com/Pictures/web/og-salon.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The wash and spa area at The Abide House Salon">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" type="image/png" sizes="64x64" href="Pictures/web/favicon.png">
<link rel="apple-touch-icon" href="Pictures/web/apple-touch-icon.png">

<!-- Visitors go straight through to the stylists. Deliberately JavaScript only:
     a meta refresh can be followed by link scrapers, which would hand them the
     homepage's preview image and defeat the point of this page. -->
<script>window.location.replace('/#salon');</script>

</style>
</head>
